<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Outils — Maderino Production</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF6B2B;
    --black: #060608;
    --text: #D8D8DC;
    --muted: #6E6E76;
    --white: #FFFFFF;
    --glass-bg: rgba(18, 18, 26, 0.80);
    --glass-bg-hover: rgba(28, 28, 38, 0.90);
    --glass-border: rgba(255, 255, 255, 0.10);
    --glass-border-top: rgba(255, 255, 255, 0.18);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.06) inset;
    --glass-blur: blur(24px) saturate(180%);
    --glass-radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background-image:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(255,107,43,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 50% 50% at 80% 80%, rgba(80,60,180,0.06) 0%, transparent 70%);
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 540px;
    width: 100%;
  }

  /* ── LOGO ── */
  .logo-wrap {
    text-align: center;
    margin-bottom: 40px;
  }

  .logo-wrap img {
    height: 48px;
    width: auto;
    opacity: 0.92;
    display: block;
    margin: 0 auto 16px;
  }

  .logo-eyebrow {
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--orange);
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .logo-title {
    font-family: 'Inter', sans-serif; font-weight: 700;
    font-size: 42px;
    letter-spacing: 6px;
    color: var(--white);
    line-height: 1;
    text-shadow: 0 0 40px rgba(255,107,43,0.20);
  }

  .logo-title span { color: var(--orange); }

  .logo-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    letter-spacing: 0.5px;
  }

  /* ── GRID ── */
  .tools-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 32px;
  }

  .tool-card {
    display: block;
    text-decoration: none;
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-top-color: var(--glass-border-top);
    border-radius: var(--glass-radius);
    box-shadow: var(--glass-shadow);
    padding: 22px 20px;
    position: relative;
    overflow: hidden;
    transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
  }

  .tool-card::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
  }

  .tool-card:hover {
    background: var(--glass-bg-hover);
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.08) inset;
  }

  .tool-card:hover .tool-arrow {
    color: var(--orange);
    transform: translateX(3px);
  }

  /* active bar on hover */
  .tool-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--orange);
    border-radius: var(--glass-radius) var(--glass-radius) 0 0;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .tool-card:hover::after { opacity: 1; }

  .tool-icon {
    font-size: 22px;
    margin-bottom: 12px;
    display: block;
  }

  .tool-name {
    font-family: 'Inter', sans-serif; font-weight: 700;
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--white);
    margin-bottom: 4px;
    line-height: 1;
  }

  .tool-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* carte pleine largeur */
  .tool-card--full {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
  }

  .tool-card--full .tool-icon { margin-bottom: 0; font-size: 20px; }
  .tool-card--full .tool-name { margin-bottom: 2px; }

  .tool-arrow {
    position: absolute;
    bottom: 18px;
    right: 18px;
    font-size: 14px;
    color: var(--muted);
    transition: color 0.15s, transform 0.15s;
  }

  /* ── FOOTER ── */
  .footer {
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }

  /* ── MOBILE ── */
  @media (max-width: 440px) {
    body { padding: 28px 14px; justify-content: flex-start; padding-top: 48px; }
    .logo-title { font-size: 34px; }
    .tools-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .tool-card { padding: 18px 16px; }
    .tool-name { font-size: 16px; }
  }
</style>
  <!-- Typo « style méta instagram » : Inter Bold serré + Playfair Display italique -->
  <style>
    h1, h2, h3 { letter-spacing: -0.035em !important; }
    h1, .logo-title { font-weight: 700 !important; line-height: 1.05 !important; text-transform: lowercase !important; letter-spacing: -0.045em !important; }
    h1 em, h1 span, h2 em, .logo-title span { font-family: 'Playfair Display', Georgia, serif !important; font-style: italic !important; font-weight: 400 !important; letter-spacing: -0.01em !important; }
  </style>
</head>
<body>
<div class="container">

  <div class="logo-wrap">
    <img src="../assets/logo-maderino-blanc.png" alt="Maderino Prod">
    <div class="logo-eyebrow">Usage interne</div>
    <div class="logo-title">MADERINO <span>PROD</span></div>
    <div class="logo-sub">Outils internes</div>
  </div>

  <div class="tools-grid">

    <a class="tool-card tool-card--full" href="pricing.html">
      <span class="tool-icon">💶</span>
      <div class="tool-name">Pricing</div>
      <div class="tool-desc">Taux horaire et calcul de prix</div>
      <span class="tool-arrow">→</span>
    </a>

    <a class="tool-card tool-card--full" href="jed_togo_editorial.html">
      <span class="tool-icon">🌱</span>
      <div class="tool-name">JED Togo</div>
      <div class="tool-desc">Calendrier éditorial — validation de contenus</div>
      <span class="tool-arrow">→</span>
    </a>

  </div>

  <div class="footer">maderinoprod.com · usage interne uniquement</div>

</div>
</body>
</html>
