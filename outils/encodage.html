<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maderino — Presets Encodage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --surface: rgba(255,255,255,0.04);
  --surface2: rgba(255,255,255,0.07);
  --surface3: rgba(255,255,255,0.10);
  --glass: rgba(18,18,18,0.72);
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --border3: rgba(255,255,255,0.22);
  --text: #f5f5f5;
  --text2: rgba(245,245,245,0.55);
  --text3: rgba(245,245,245,0.3);
  --accent: #FF6B2B;
  --accent-soft: rgba(255,107,43,0.12);
  --accent-border: rgba(255,107,43,0.35);
  --green: #34d399;
  --green-soft: rgba(52,211,153,0.1);
  --orange: #fbbf24;
  --orange-soft: rgba(251,191,36,0.1);
  --blue: #60a5fa;
  --blue-soft: rgba(96,165,250,0.1);
  --purple: #a78bfa;
  --purple-soft: rgba(167,139,250,0.1);
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* NOISE OVERLAY */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:0;
}

/* GLOW BG */
body::after{
  content:'';
  position:fixed;
  width:600px;height:600px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,107,43,0.06) 0%, transparent 70%);
  top:-100px;left:-100px;
  pointer-events:none;
  z-index:0;
}

/* HEADER */
header{
  position:relative;z-index:10;
  padding:20px 32px;
  border-bottom:1px solid var(--border);
  background:var(--glass);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;gap:14px;
}
.logo-mark{
  width:36px;height:36px;
  background:var(--accent);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#fff;
  letter-spacing:-0.5px;
  flex-shrink:0;
}
.logo-text{font-size:16px;font-weight:600;letter-spacing:-0.3px}
.logo-text span{color:var(--accent)}
.logo-sub{font-size:11px;color:var(--text3);margin-top:1px;letter-spacing:0.02em}

/* WRAP */
.wrap{
  position:relative;z-index:1;
  max-width:1060px;
  margin:0 auto;
  padding:40px 32px 80px;
}

/* STEP HEADER */
.step-head{
  display:flex;align-items:center;gap:10px;
  margin-bottom:16px;
}
.step-pill{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;
  background:var(--accent);
  font-size:11px;font-weight:700;color:#fff;
  flex-shrink:0;
}
.step-pill.done{background:var(--green);color:#0a0a0a}
.step-name{
  font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.12em;
  color:var(--text3);
}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:32px 0}

/* CAT LABEL */
.cat-label{
  font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.12em;
  color:var(--text3);
  margin-bottom:10px;margin-top:20px;
}
.cat-label:first-child{margin-top:0}

/* DEST GRID */
.dest-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(148px,1fr));
  gap:8px;
}

.dest-btn{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px 14px;
  cursor:pointer;
  text-align:left;
  transition:all 0.15s;
  font-family:var(--sans);
  color:var(--text2);
  position:relative;
  overflow:hidden;
}
.dest-btn::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%);
  pointer-events:none;
}
.dest-btn:hover{
  border-color:var(--border2);
  color:var(--text);
  background:var(--surface2);
  transform:translateY(-1px);
}
.dest-btn.active{
  border-color:var(--accent-border);
  background:var(--accent-soft);
  color:var(--text);
}
.dest-btn.active::after{
  content:'';
  position:absolute;
  top:0;left:0;right:0;height:2px;
  background:var(--accent);
  border-radius:14px 14px 0 0;
}
.dest-icon{font-size:18px;margin-bottom:10px;display:block}
.dest-name{font-size:13px;font-weight:600;display:block;margin-bottom:4px;letter-spacing:-0.2px}
.dest-codec{font-size:10px;display:block;font-family:monospace;letter-spacing:0.02em;opacity:0.7}
.dest-btn.active .dest-codec{opacity:1}

/* PILLS */
.pill-row{display:flex;flex-wrap:wrap;gap:6px}
.pill{
  padding:8px 20px;
  border-radius:100px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text2);
  font-size:13px;font-weight:500;
  cursor:pointer;
  font-family:var(--sans);
  transition:all 0.12s;
  letter-spacing:-0.1px;
}
.pill:hover{border-color:var(--border2);color:var(--text);background:var(--surface2)}
.pill.active{
  border-color:var(--accent);
  color:var(--accent);
  background:var(--accent-soft);
}

/* RESULT */
#result{display:none}
#result.show{display:block}

.result-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
  margin-bottom:28px;
  padding-bottom:22px;
  border-bottom:1px solid var(--border);
}
.result-title{font-size:26px;font-weight:700;letter-spacing:-0.8px;line-height:1.2}
.result-title span{color:var(--accent)}
.result-sub{font-size:13px;color:var(--text2);margin-top:5px;letter-spacing:0.01em}

.codec-chip{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--surface2);
  border:1px solid var(--border2);
  border-radius:100px;
  padding:7px 14px;
  font-size:12px;
  font-family:monospace;
  color:var(--text);
  white-space:nowrap;
  backdrop-filter:blur(8px);
}
.chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.chip-dot.orange{background:var(--accent)}
.chip-dot.blue{background:var(--blue)}
.chip-dot.purple{background:var(--purple)}
.chip-dot.green{background:var(--green)}

/* SEC TITLE */
.sec-title{
  font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.12em;
  color:var(--text3);
  margin:24px 0 10px;
  padding-bottom:7px;
  border-bottom:1px solid var(--border);
}

/* CARDS GRID */
.cards{display:grid;gap:10px;margin-bottom:10px}
.col2{grid-template-columns:1fr 1fr}
.col3{grid-template-columns:1fr 1fr 1fr}
.col4{grid-template-columns:1fr 1fr 1fr 1fr}

/* GLASS CARD */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px 17px;
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(8px);
  transition:border-color 0.12s;
}
.card::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  pointer-events:none;
}
.card:hover{border-color:var(--border2)}
.card-label{
  font-size:10px;color:var(--text3);
  text-transform:uppercase;letter-spacing:.07em;
  margin-bottom:6px;
}
.card-val{
  font-size:18px;font-weight:700;
  font-family:monospace;
  color:var(--text);
  letter-spacing:-0.3px;
}
.card-val.accent{color:var(--accent)}
.card-val.green{color:var(--green)}
.card-val.orange{color:var(--orange)}
.card-val.blue{color:var(--blue)}
.card-val.purple{color:var(--purple)}
.card-sub{font-size:11px;color:var(--text3);margin-top:3px;font-family:monospace}

/* TAG */
.tag{
  display:inline-block;font-size:10px;
  padding:2px 8px;border-radius:100px;
  font-weight:600;margin-left:7px;vertical-align:middle;
}
.tag-10{background:var(--green-soft);color:var(--green);border:1px solid rgba(52,211,153,0.25)}
.tag-8{background:var(--orange-soft);color:var(--orange);border:1px solid rgba(251,191,36,0.2)}
.tag-alpha{background:var(--purple-soft);color:var(--purple);border:1px solid rgba(167,139,250,0.25)}

/* NOTE */
.note{
  background:var(--accent-soft);
  border:1px solid var(--accent-border);
  border-radius:14px;
  padding:15px 18px;
  font-size:13px;color:var(--text2);
  line-height:1.65;margin-top:24px;
}
.note strong{color:var(--accent);font-weight:600}
.note.blue{background:var(--blue-soft);border-color:rgba(96,165,250,0.25)}
.note.blue strong{color:var(--blue)}
.note.purple{background:var(--purple-soft);border-color:rgba(167,139,250,0.25)}
.note.purple strong{color:var(--purple)}
.note.green{background:var(--green-soft);border-color:rgba(52,211,153,0.25)}
.note.green strong{color:var(--green)}

/* EMPTY */
.empty{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:60px 20px;gap:10px;
  color:var(--text3);text-align:center;font-size:13px;
}

/* HINT */
.hint{font-size:12px;color:var(--text3);letter-spacing:0.01em}

@media(max-width:640px){
  .wrap{padding:24px 16px 60px}
  header{padding:14px 16px}
  .cards.col3,.cards.col4{grid-template-columns:1fr 1fr}
  .cards.col2{grid-template-columns:1fr 1fr}
  .result-title{font-size:20px}
  .dest-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
</style>
</head>

    noteStyle:'purple',
    proResSizes:{
      '1080p':{24:'~2.1 GB/min',25:'~2.2 GB/min',30:'~2.6 GB/min',50:'~4.4 GB/min',60:'~5.3 GB/min'},
      '2K':{24:'~3.8 GB/min',25:'~4.0 GB/min',30:'~4.8 GB/min',50:'~8.0 GB/min',60:'~9.6 GB/min'},
      '4K':{24:'~8.5 GB/min',25:'~8.9 GB/min',30:'~10.6 GB/min',50:'~17.7 GB/min',60:'~21.2 GB/min'},
    },
    bitrates:{},
  },
  {
    id:'streamelements', label:'StreamElements', icon:'📡', cat:'stream',
    codec:'VP9 (WebM)', codecColor:'purple', format:'WebM',
    profile:{all:'VP9 Alpha'},
    profileBit:{all:'8-bit + Alpha'},
    resOptions:['1080p'], fpsOptions:[24,25,30,50,60],
    ori:'Horizontal',
    audio:{codec:'Opus', bitrate:192},
    vbr:'1 passe',
    isWebM:true,
    note:'<strong>WebM + VP9</strong> — seul format vidéo transparent supporté nativement par les navigateurs (browser source OBS, StreamElements, overlays web). <strong>Alpha channel activé</strong> obligatoire. Bitrate modéré — c\'est du streaming HTTP. <strong>Audio Opus</strong> (natif WebM).',
    noteStyle:'purple',
    bitrates:{
      '1080p':{24:[4,6],25:[4,6],30:[5,8],50:[8,12],60:[10,14]},
    },
  },
];

const RES_DIMS={
  '1080p':{h:'1920 × 1080',v:'1080 × 1920'},
  '2K':{h:'2560 × 1440',v:'1440 × 2560'},
  '4K':{h:'3840 × 2160',v:'2160 × 3840'},
};

let sel={dest:null,res:null,fps:null};

function destData(){return DESTS.find(d=>d.id===sel.dest)}
function getProfile(d,res){return d.profile[res]||d.profile['all']||d.profile['1080p']}
function getProfileBit(d,res){return d.profileBit[res]||d.profileBit['all']||d.profileBit['1080p']}
function getDims(res,ori){const m=RES_DIMS[res];if(!m)return '—';return ori==='Vertical'?m.v:m.h}

function buildDests(){
  const grid=document.getElementById('destGrid');
  const cats=[
    {id:'social',label:'Réseaux sociaux'},
    {id:'pro',label:'Production & Livraison'},
    {id:'stream',label:'Stream & Overlay'},
  ];
  const colorMap={orange:'#FF6B2B',blue:'#60a5fa',purple:'#a78bfa',green:'#34d399'};
  let html='';
  cats.forEach(cat=>{
    const items=DESTS.filter(d=>d.cat===cat.id);
    if(!items.length)return;
    html+=`<div class="cat-label">${cat.label}</div><div class="dest-grid">`;
    items.forEach(d=>{
      const col=sel.dest===d.id?colorMap[d.codecColor]:'';
      html+=`<button class="dest-btn${sel.dest===d.id?' active':''}" onclick="setDest('${d.id}')">
        <span class="dest-icon">${d.icon}</span>
        <span class="dest-name">${d.label}</span>
        <span class="dest-codec" style="${col?'color:'+col:''}">${d.codec} · ${d.format}</span>
      </button>`;
    });
    html+='</div>';
  });
  grid.innerHTML=html;
}

function buildRes(){
  const row=document.getElementById('resRow');
  if(!sel.dest){row.innerHTML='<span class="hint">Sélectionne une destination d\'abord</span>';return}
  const d=destData();
  row.innerHTML=d.resOptions.map(r=>
    `<button class="pill${sel.res===r?' active':''}" onclick="setRes('${r}')">${r}</button>`
  ).join('');
}

function buildFps(){
  const row=document.getElementById('fpsRow');
  if(!sel.dest){row.innerHTML='<span class="hint">Sélectionne une destination d\'abord</span>';return}
  const d=destData();
  row.innerHTML=d.fpsOptions.map(f=>
    `<button class="pill${sel.fps===f?' active':''}" onclick="setFps(${f})">${f} fps</button>`
  ).join('');
}

function render(){
  const resultEl=document.getElementById('result');
  const inner=document.getElementById('resultInner');
  if(!sel.dest||!sel.res||!sel.fps){resultEl.classList.remove('show');return}

  const d=destData();
  const dims=getDims(sel.res,d.ori);
  const profile=getProfile(d,sel.res);
  const profileBit=getProfileBit(d,sel.res);
  const is10bit=profileBit.includes('10-bit')||profileBit.includes('12-bit');
  const isAlpha=profileBit.includes('Alpha');
  const dotClass={orange:'orange',blue:'blue',purple:'purple',green:'green'}[d.codecColor]||'orange';

  const tagHTML=is10bit
    ?`<span class="tag tag-10">${profileBit}</span>`
    :isAlpha
      ?`<span class="tag tag-alpha">${profileBit}</span>`
      :`<span class="tag tag-8">${profileBit}</span>`;

  let bitrateHTML='';
  if(d.isProRes){
    const size=d.proResSizes[sel.res]?.[sel.fps]||'—';
    bitrateHTML=`
      <div class="sec-title">Débit / Taille estimée</div>
      <div class="cards col2">
        <div class="card">
          <div class="card-label">Format</div>
          <div class="card-val purple">${d.codec}</div>
          <div class="card-sub">Intra-frame · pas de VBR</div>
        </div>
        <div class="card">
          <div class="card-label">Taille estimée</div>
          <div class="card-val accent">${size}</div>
          <div class="card-sub">fichier lourd = normal</div>
        </div>
      </div>`;
  } else {
    const br=d.bitrates[sel.res]?.[sel.fps];
    if(!br){
      inner.innerHTML=`<div class="empty">⚠️<br>Combinaison non disponible.</div>`;
      resultEl.classList.add('show');return;
    }
    const[target,max]=br;
    bitrateHTML=`
      <div class="sec-title">Débit vidéo</div>
      <div class="cards col3">
        <div class="card">
          <div class="card-label">Mode</div>
          <div class="card-val green">VBR ${d.vbr}</div>
        </div>
        <div class="card">
          <div class="card-label">Débit cible</div>
          <div class="card-val accent">${target} Mbps</div>
        </div>
        <div class="card">
          <div class="card-label">Débit maximum</div>
          <div class="card-val">${max} Mbps</div>
        </div>
      </div>`;
  }

  const audioDebit=d.audio.bitrate?`${d.audio.bitrate} kbps`:'Non compressé';

  inner.innerHTML=`
    <div class="result-head">
      <div>
        <div class="result-title">${d.label} — <span>${sel.res} · ${sel.fps}fps</span></div>
        <div class="result-sub">${d.ori} · ${dims}</div>
      </div>
      <div class="codec-chip">
        <span class="chip-dot ${dotClass}"></span>
        ${d.codec} · ${d.format}
      </div>
    </div>

    ${bitrateHTML}

    <div class="sec-title">Vidéo — Avancé</div>
    <div class="cards col${isAlpha?'3':'2'}">
      <div class="card">
        <div class="card-label">Profile ${tagHTML}</div>
        <div class="card-val ${is10bit?'green':isAlpha?'purple':'orange'}">${profile}</div>
      </div>
      <div class="card">
        <div class="card-label">Rendu</div>
        <div class="card-val">Matériel (NVIDIA)</div>
      </div>
      ${isAlpha?`<div class="card">
        <div class="card-label">Alpha channel</div>
        <div class="card-val purple">Activé</div>
      </div>`:''}
    </div>

    <div class="sec-title">Audio</div>
    <div class="cards col3">
      <div class="card">
        <div class="card-label">Codec audio</div>
        <div class="card-val">${d.audio.codec}</div>
      </div>
      <div class="card">
        <div class="card-label">Débit audio</div>
        <div class="card-val ${d.audio.bitrate?'':'purple'}">${audioDebit}</div>
      </div>
      <div class="card">
        <div class="card-label">Fréquence</div>
        <div class="card-val">48 000 Hz</div>
      </div>
    </div>

    <div class="note ${d.noteStyle}">${d.note}</div>
  `;

  resultEl.classList.add('show');
  document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});
}

function setDest(id){
  sel.dest=id;
  const d=DESTS.find(x=>x.id===id);
  if(!d.resOptions.includes(sel.res))sel.res=null;
  if(!d.fpsOptions.includes(sel.fps))sel.fps=null;
  buildDests();buildRes();buildFps();render();
}
function setRes(r){sel.res=r;buildRes();render()}
function setFps(f){sel.fps=f;buildFps();render()}

buildDests();buildRes();buildFps();
</script>
</body>
</html>
