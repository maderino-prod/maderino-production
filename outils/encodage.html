<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maderino — Presets H.265 NVENC</title>
<style>
  :root {
    --bg: #0D0D0D;
    --bg2: #1A1A1A;
    --bg3: #222222;
    --border: #2a2a2a;
    --border2: #333333;
    --text: #f0f0f0;
    --text2: #999;
    --text3: #666;
    --accent: #FF6B2B;
    --accent2: #ff8a50;
    --green: #2ecc71;
    --orange: #f39c12;
    --mono: 'Courier New', monospace;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .logo-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }

  .layout { display: flex; min-height: calc(100vh - 65px); }

  .sidebar {
    width: 280px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .group-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text3);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .btn-group { display: flex; flex-direction: column; gap: 4px; }
  .btn {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    transition: all 0.12s;
    font-family: var(--sans);
  }
  .btn:hover { background: var(--bg3); color: var(--text); }
  .btn.active { background: var(--bg3); color: var(--text); border-color: var(--border2); }
  .btn.active::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: middle; }

  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .btn-sq {
    padding: 8px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    text-align: center;
    transition: all 0.12s;
    font-family: var(--sans);
  }
  .btn-sq:hover { border-color: var(--border2); color: var(--text); }
  .btn-sq.active { border-color: var(--accent); color: var(--accent); background: rgba(255,107,43,0.08); }

  .main { flex: 1; padding: 32px; overflow-y: auto; }

  .preset-header {
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .preset-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
  .preset-title span { color: var(--accent); }
  .preset-desc { font-size: 13px; color: var(--text2); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }

  .section-title {
    font-size: 10px;
    font-weight: 600;
    color: var(--text3);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin: 24px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .field-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .field-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .05em; }
  .field-value { font-size: 15px; font-weight: 600; color: var(--text); font-family: var(--mono); }
  .field-value.accent { color: var(--accent); }
  .field-value.green { color: var(--green); }
  .field-value.orange { color: var(--orange); }

  .note-box {
    background: rgba(255,107,43,0.06);
    border: 1px solid rgba(255,107,43,0.2);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 13px;
    color: var(--text2);
    line-height: 1.6;
    margin-top: 20px;
  }
  .note-box strong { color: var(--accent); font-weight: 600; }

  .copy-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 20px;
  }
  .copy-name { font-size: 13px; font-family: var(--mono); color: var(--text2); }
  .copy-name span { color: var(--accent); }
  .copy-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
    transition: background 0.12s;
  }
  .copy-btn:hover { background: var(--accent2); }
  .copy-btn.done { background: var(--green); }

  .tag {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
    margin-left: 8px;
    vertical-align: middle;
  }
  .tag-warn { background: rgba(243,156,18,0.15); color: var(--orange); border: 1px solid rgba(243,156,18,0.3); }
  .tag-ok { background: rgba(46,204,113,0.1); color: var(--green); border: 1px solid rgba(46,204,113,0.25); }

  .unavail {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 300px;
    flex-direction: column;
    gap: 12px;
    color: var(--text3);
  }
  .unavail-icon { font-size: 40px; }
  .unavail-text { font-size: 14px; }

  @media (max-width: 700px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Maderino <span>Prod</span></div>
    <div class="logo-sub">Générateur de presets H.265 NVENC — Adobe Media Encoder</div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div>
      <div class="group-label">Destination</div>
      <div class="btn-group" id="destBtns"></div>
    </div>
    <div>
      <div class="group-label">Résolution</div>
      <div class="btn-grid" id="resBtns"></div>
    </div>
    <div>
      <div class="group-label">Fréquence (fps)</div>
      <div class="btn-grid" id="fpsBtns"></div>
    </div>
    <div>
      <div class="group-label">Orientation</div>
      <div class="btn-grid" id="oriBtns"></div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script>
const DESTS = [
  { id:'insta', label:'Instagram', cat:'social' },
  { id:'tiktok', label:'TikTok', cat:'social' },
  { id:'youtube', label:'YouTube', cat:'social' },
  { id:'master', label:'Master client', cat:'master' },
  { id:'web', label:'Web embarqué', cat:'web' },
  { id:'diff', label:'Diffusion', cat:'diff' },
];

const RES_OPTIONS = ['1080p','2K','4K'];
const FPS_OPTIONS = [24,25,30,50,60];
const ORI_OPTIONS = ['Horizontal','Vertical'];

const RES_MAP = {
  '1080p': { w:1920, h:1080, wv:1080, hv:1920 },
  '2K':    { w:2560, h:1440, wv:1440, hv:2560 },
  '4K':    { w:3840, h:2160, wv:2160, hv:3840 },
};

const LEVEL_MAP = {
  '1080p': { 24:'4.0', 25:'4.0', 30:'4.0', 50:'4.1', 60:'4.1' },
  '2K':    { 24:'5.0', 25:'5.0', 30:'5.0', 50:'5.1', 60:'5.1' },
  '4K':    { 24:'5.1', 25:'5.1', 30:'5.1', 50:'5.2', 60:'5.2' },
};

const UNAVAIL = {};

const DATA = {
  insta: {
    label:'Instagram',
    profile:'Main', profileClass:'orange',
    profile4k:'Main 10', profile4kClass:'green',
    qual:'Bonne',
    bframes:2,
    note:'<strong>Profile Main 8-bit en 1080p/2K.</strong> En 4K, Main 10 accepté — Instagram affiche en 4K sur les appareils compatibles, la source plus propre se ressent. La plateforme réencode mais une base 4K donne un résultat visible.',
    bitrates: {
      '1080p': { 24:[10,16], 25:[12,18], 30:[14,20], 50:[16,24], 60:[18,26] },
      '2K':    { 24:[22,32], 25:[25,35], 30:[28,40], 50:[32,45], 60:[35,50] },
      '4K':    { 24:[45,65], 25:[50,70], 30:[55,80], 50:[65,90], 60:[70,100] },
    },
  },
  tiktok: {
    label:'TikTok',
    profile:'Main', profileClass:'orange',
    profile4k:'Main 10', profile4kClass:'green',
    qual:'Bonne',
    bframes:2,
    note:'<strong>Profile Main 8-bit en 1080p/2K.</strong> En 4K, Main 10 accepté — TikTok affiche en 4K sur les appareils compatibles. Format vertical 9:16 recommandé pour les Reels et contenus gaming.',
    bitrates: {
      '1080p': { 24:[10,16], 25:[12,18], 30:[14,20], 50:[16,24], 60:[18,26] },
      '2K':    { 24:[22,32], 25:[25,35], 30:[28,40], 50:[32,45], 60:[35,50] },
      '4K':    { 24:[45,65], 25:[50,70], 30:[55,80], 50:[65,90], 60:[70,100] },
    },
  },
  youtube: {
    label:'YouTube',
    profile:'Main', profileClass:'orange',
    profile4k:'Main 10', profile4kClass:'green',
    qual:'Plus élevée',
    bframes:3,
    note:'YouTube réencode en VP9/AV1. Bitrate généreux = meilleure base au réencodeur. <strong>Main 8-bit en 1080p/2K</strong>. <strong>Main 10 accepté en 4K</strong> — YouTube le préserve mieux à cette résolution.',
    bitrates: {
      '1080p': { 24:[8,12], 25:[8,12], 30:[10,12], 50:[14,20], 60:[16,20] },
      '2K':    { 24:[15,26], 25:[16,28], 30:[20,35], 50:[29,40], 60:[33,40] },
      '4K':    { 24:[22,28], 25:[24,30], 30:[30,38], 50:[44,55], 60:[50,60] },
    },
  },
  master: {
    label:'Master client',
    profile:'Main 10', profileClass:'green',
    qual:'La plus élevée (la plus lente)',
    bframes:4,
    note:'<strong>Main 10 obligatoire</strong> pour préserver la colorimétrie D-Log M après étalonnage. Qualité preset max justifiée sur un master — c\'est la livraison finale. Fichier lourd, c\'est normal.',
    bitrates: {
      '1080p': { 24:[35,55], 25:[40,60], 30:[45,65], 50:[55,75], 60:[60,80] },
      '2K':    { 24:[55,80], 25:[60,85], 30:[65,90], 50:[75,100], 60:[80,110] },
      '4K':    { 24:[75,110], 25:[80,120], 30:[90,130], 50:[100,150], 60:[120,160] },
    },
  },
  web: {
    label:'Web embarqué',
    profile:'Main', profileClass:'orange',
    qual:'Bonne',
    bframes:2,
    note:'<strong>Main 8-bit obligatoire</strong> pour lecture universelle dans les navigateurs (Safari, iOS, Android). Level 4.0 en 1080p pour compatibilité maximale. Bitrate bas car diffusion HTTP.',
    bitrates: {
      '1080p': { 24:[7,10], 25:[8,12], 30:[10,15], 50:[12,18], 60:[14,20] },
      '2K':    { 24:[14,20], 25:[16,24], 30:[18,28], 50:[22,32], 60:[25,36] },
      '4K':    { 24:[28,42], 25:[30,45], 30:[35,50], 50:[45,65], 60:[50,70] },
    },
  },
  diff: {
    label:'Diffusion',
    profile:'Main', profileClass:'orange',
    profile4k:'Main 10', profile4kClass:'green',
    qual:'Plus élevée',
    bframes:2,
    note:'<strong>Main 8-bit en 1080p/2K</strong>, <strong>Main 10 en 4K</strong> pour compatibilité HDR broadcast. B-frames réduits à 2 pour meilleure résistance aux erreurs de transmission.',
    bitrates: {
      '1080p': { 24:[12,18], 25:[15,20], 30:[18,24], 50:[20,28], 60:[22,30] },
      '2K':    { 24:[22,32], 25:[25,35], 30:[28,40], 50:[32,45], 60:[35,50] },
      '4K':    { 24:[45,65], 25:[50,70], 30:[55,80], 50:[65,90], 60:[75,100] },
    },
  },
};

let sel = { dest:'insta', res:'1080p', fps:25, ori:'Horizontal' };

function getPresetName(dest, res, fps, ori) {
  const d = DATA[dest];
  const oriTag = ori === 'Vertical' ? '_V' : '';
  return `MP_${d.label.replace(' ','')}_${res}_${fps}fps${oriTag}`;
}

function getProfile(dest, res) {
  const d = DATA[dest];
  if (res === '4K' && d.profile4k) return { val: d.profile4k, cls: d.profile4kClass };
  return { val: d.profile, cls: d.profileClass };
}

function getDims(res, ori) {
  const r = RES_MAP[res];
  if (ori === 'Vertical') return `${r.wv} × ${r.hv}`;
  return `${r.w} × ${r.h}`;
}

function getLevel(res, fps) {
  return LEVEL_MAP[res][fps];
}

function getGOP(fps) { return fps; }

function render() {
  const { dest, res, fps, ori } = sel;
  const d = DATA[dest];
  const main = document.getElementById('main');

  if (UNAVAIL[dest] && UNAVAIL[dest].includes(res)) {
    main.innerHTML = `<div class="unavail">
      <div class="unavail-icon">⚠️</div>
      <div class="unavail-text">${d.label} ne supporte pas la résolution ${res}.</div>
      <div style="font-size:12px;color:var(--text3);margin-top:4px">Sélectionne 1080p pour cette destination.</div>
    </div>`;
    return;
  }

  const br = d.bitrates[res] && d.bitrates[res][fps];
  if (!br) {
    main.innerHTML = `<div class="unavail"><div class="unavail-text">Combinaison non disponible.</div></div>`;
    return;
  }

  const [target, max] = br;
  const profile = getProfile(dest, res);
  const level = getLevel(res, fps);
  const gop = getGOP(fps);
  const dims = getDims(res, ori);
  const presetName = getPresetName(dest, res, fps, ori);

  const copyText = `Preset AME — H.265 NVENC
Nom: ${presetName}

FORMAT DE SORTIE
Format: H.265

VIDÉO — BASIQUE
Codec: H.265 (HEVC)
Rendu: Matériel (NVIDIA)
Résolution: ${dims}
Fréquence d'images: Identique à la source
Aspect: Carré (1.0)
Ordre des champs: Progressif

VIDÉO — DÉBIT
Mode: VBR, 1 passe
Débit cible: ${target} Mbps
Débit maximum: ${max} Mbps

VIDÉO — AVANCÉ
Profile: ${profile.val}
Level: ${level}
Images clés (GOP): ${gop}
Qualité: ${d.qual}
Lookahead: Activé
B-frames: ${d.bframes}

AUDIO
Codec: AAC
Débit: ${dest === 'insta' || dest === 'tiktok' || dest === 'web' ? '192' : '320'} kbps
Fréquence: 48 000 Hz
Canaux: Stéréo`;

  main.innerHTML = `
    <div class="preset-header">
      <div class="preset-title">${d.label} — <span>${res} ${fps}fps</span>${ori === 'Vertical' ? ' · Vertical' : ''}</div>
      <div class="preset-desc">H.265 NVENC · VBR 1 passe · ${dims}</div>
    </div>

    <div class="section-title">Format de sortie</div>
    <div class="grid-3">
      <div class="field-card"><div class="field-label">Format</div><div class="field-value accent">H.265</div></div>
      <div class="field-card"><div class="field-label">Codec vidéo</div><div class="field-value">H.265 (HEVC)</div></div>
      <div class="field-card"><div class="field-label">Performance de rendu</div><div class="field-value">Matériel (NVIDIA)</div></div>
    </div>

    <div class="section-title">Vidéo — Basique</div>
    <div class="grid-3">
      <div class="field-card"><div class="field-label">Résolution</div><div class="field-value accent">${dims}</div></div>
      <div class="field-card"><div class="field-label">Fréquence d'images</div><div class="field-value green">Source</div></div>
      <div class="field-card"><div class="field-label">Ordre des champs</div><div class="field-value">Progressif</div></div>
    </div>

    <div class="section-title">Vidéo — Débit</div>
    <div class="grid-3">
      <div class="field-card"><div class="field-label">Mode</div><div class="field-value green">VBR, 1 passe</div></div>
      <div class="field-card"><div class="field-label">Débit cible</div><div class="field-value accent">${target} Mbps</div></div>
      <div class="field-card"><div class="field-label">Débit maximum</div><div class="field-value">${max} Mbps</div></div>
    </div>

    <div class="section-title">Vidéo — Avancé</div>
    <div class="grid-3">
      <div class="field-card">
        <div class="field-label">Profile <span class="tag ${profile.cls === 'green' ? 'tag-ok' : 'tag-warn'}">${profile.cls === 'green' ? '10-bit' : '8-bit'}</span></div>
        <div class="field-value ${profile.cls}">${profile.val}</div>
      </div>
      <div class="field-card"><div class="field-label">Level</div><div class="field-value">${level}</div></div>
      <div class="field-card"><div class="field-label">Images clés (GOP)</div><div class="field-value">${gop}</div></div>
    </div>
    <div class="grid-3">
      <div class="field-card"><div class="field-label">Qualité preset</div><div class="field-value" style="font-size:13px">${d.qual}</div></div>
      <div class="field-card"><div class="field-label">Lookahead</div><div class="field-value green">Activé</div></div>
      <div class="field-card"><div class="field-label">B-frames</div><div class="field-value">${d.bframes}</div></div>
    </div>

    <div class="section-title">Audio</div>
    <div class="grid-3">
      <div class="field-card"><div class="field-label">Codec audio</div><div class="field-value">AAC</div></div>
      <div class="field-card"><div class="field-label">Débit audio</div><div class="field-value">${dest === 'insta' || dest === 'tiktok' || dest === 'web' ? '192' : '320'} kbps</div></div>
      <div class="field-card"><div class="field-label">Fréquence</div><div class="field-value">48 000 Hz</div></div>
    </div>

    <div class="note-box">${d.note}</div>

    <div class="copy-bar">
      <div class="copy-name">Nom du preset : <span>${presetName}</span></div>
      <button class="copy-btn" id="copyBtn" onclick="copyPreset(\`${copyText.replace(/`/g,"'")}\`)">Copier tout</button>
    </div>
  `;
}

function copyPreset(txt) {
  navigator.clipboard.writeText(txt);
  const btn = document.getElementById('copyBtn');
  btn.textContent = 'Copié !';
  btn.classList.add('done');
  setTimeout(() => { btn.textContent = 'Copier tout'; btn.classList.remove('done'); }, 2000);
}

function buildSidebar() {
  document.getElementById('destBtns').innerHTML = DESTS.map(d =>
    `<button class="btn${sel.dest===d.id?' active':''}" onclick="setSel('dest','${d.id}')">${d.label}</button>`
  ).join('');

  document.getElementById('resBtns').innerHTML = RES_OPTIONS.map(r =>
    `<button class="btn-sq${sel.res===r?' active':''}" onclick="setSel('res','${r}')">${r}</button>`
  ).join('');

  document.getElementById('fpsBtns').innerHTML = FPS_OPTIONS.map(f =>
    `<button class="btn-sq${sel.fps===f?' active':''}" onclick="setSel('fps',${f})">${f}</button>`
  ).join('');

  document.getElementById('oriBtns').innerHTML = ORI_OPTIONS.map(o =>
    `<button class="btn-sq${sel.ori===o?' active':''}" onclick="setSel('ori','${o}')">${o}</button>`
  ).join('');
}

function setSel(key, val) {
  sel[key] = val;
  if (key === 'dest' && UNAVAIL[val] && UNAVAIL[val].includes(sel.res)) {
    sel.res = '1080p';
  }
  buildSidebar();
  render();
}

buildSidebar();
render();
</script>
</body>
</html>
